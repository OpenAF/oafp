# Value suggestions that cannot be inferred from USAGE.md option tables.
setop=:
- name: setop=union
  desc: Will return the union of the two sets
- name: setop=diffa
  desc: Will return the difference between 'a' and 'b'
- name: setop=diffb
  desc: Will return the difference between 'b' and 'a'
- name: setop=diffab
  desc: Will return the symmetric difference between 'a' and 'b'
- name: setop=diff
  desc: Will identify which set contains each entry
- name: setop=intersect
  desc: Will return the intersection of the two sets
httpmethod=:
- name: httpmethod=post
  desc: Sends the output with a POST request
- name: httpmethod=put
  desc: Sends the output with a PUT request
- name: httpmethod=patch
  desc: Sends the output with a PATCH request
- name: httpmethod=delete
  desc: Sends the output with a DELETE request
httpformat=:
- name: httpformat=json
  desc: Sends the output as JSON
- name: httpformat=yaml
  desc: Sends the output as YAML
- name: httpformat=ndjson
  desc: Sends the output as newline delimited JSON
- name: httpformat=text
  desc: Sends the output as plain text
